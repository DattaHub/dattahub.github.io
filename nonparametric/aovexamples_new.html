## R Markdown

I will show here the R codes for ANOVA. The two examples are taken from the following websites.

  -  [Spray Insects Example](http://homepages.inf.ed.ac.uk/bwebb/statistics/ANOVA_in_R.pdf)
  -  [Migraine Example (Martin Lindquist)](http://www.stat.columbia.edu/~martin/W2024/R3.pdf)

## The Data

We first read the InsectSprays dataset that has data on pain levels for three types of drugs. We create a data frame in R to store the data. 


```r
pain = c(4, 5, 4, 3, 2, 4, 3, 4, 4, 6, 8, 4, 5, 4, 6, 5, 
         8, 6, 6, 7, 6, 6, 7, 5, 6, 5, 5)
drug = c(rep("A",9), rep("B",9), rep("C",9))
migraine = data.frame(pain,drug)
str(migraine)
```

```
## 'data.frame':	27 obs. of  2 variables:
##  $ pain: num  4 5 4 3 2 4 3 4 4 6 ...
##  $ drug: chr  "A" "A" "A" "A" ...
```

---
## Descriptive statistics
-  Mean, variance, number of elements in each cell
-  Visualise the data - boxplot; look at distribution, look for outliers
-  We'll use the tapply() function which is a helpful shortcut in processing data. 
-  tapply() basically allows you to specify a response variable, a factor (or factors) and a function that should be applied to each subset of the response variable defined by each level of the factor. 

---
## Descriptive Statistics
Instead of doing

options(digits=10)
mean(pain[drug=="A"])

```

```r

```
We can simply call

```

```

```

## Descriptive Statistics

-  We need the sample variances, i.e. `\(s_j^2\)` for `\(j = 1, 2, 3\)`.

```r

```

```

## 0.7500000000 2.1944444444 0.6111111111
```

```

## ANOVA Sum of squares 
-  We need to calculate two sum of squares for the F-statistic. 
-  The numerator is between groups variation or `\(\sum_{j=1}^{K} n_j (\bar{x}_j - \bar{X})^2\)`. ($n_j$: sample size of the `\(j^{th}\)` group).
- We have calculated the `\(n_j\)`'s and the `\(\bar{x}_j\)`'s before using tapply().


```r
n_j = tapply(pain,drug,length)
SST_j = n_j * (tapply(pain,drug,mean)-mean(pain))^2
SST = sum(SST_j)
cat("SST = ", SST, '\n')
```

```
## SST =  28.22222222
```

---
## SSE
Variation within the treatments = Sum of squares for Error (SSE):
$$
SSE = (n_1 -1)s_1^2 + (n_2 - 1)s_2^2 + \cdots + (n_K -1)s_K^2 
$$


```r
SSE_j = (n_j-1)*tapply(pain,drug,var)
SSE = sum(SSE_j)
cat("SSE =", SSE, "\n")
```

```
## SSE = 28.44444444
```

---
## F-statistic 

-  Mean square for treatments = MST = `\(\frac{SST}{k-1} = \frac{28.2}{2} = 14.11\)`
-  Mean square for errors = MSE = `\(\frac{SSE}{n-k} = \frac{28.4}{27-3} = 1.19\)`.
-  The ratio of the variability among the treatment means to that within the treatment means is an `\(F\)`-statistic with `\(k-1 = 2\)` numerator and `\(n-k = 24\)` denominator degrees of freedom.



$$
F_{k-1,n-k} = \frac{MST}{MSE} = \frac{14.11}{1.19} = 11.9
$$


```r
p.value = 1-pf(11.9,2,24); cat("P value =", p.value)
```

```
## P value = 0.0002566847936
```
Reject the null hypothesis. There is a statistically significant difference between the mean pain levels for the three drugs. 

---
## ANOVA in R 

Of course, we can skip the step-by-step calculation and use a pre-canned package in R: 


```r
results &lt;- aov(pain~drug, data=migraine)
summary(results)
```

```
##             Df   Sum Sq   Mean Sq  F value     Pr(&gt;F)    
## drug         2 28.22222 14.111111 11.90625 0.00025588 ***
## Residuals   24 28.44444  1.185185                        
## ---
## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1
```

---
## Pairwise tests 

-  ANOVA tells you whether there is a significant difference between the means, but it does not provide any more information about which ones are different. 
-  The R function pairwise.t.test() compares all possible pairs with **corrections for multiple testing**. 


```r
 pairwise.t.test(pain, drug, p.adjust="bonferroni")
```

```
## 
## 	Pairwise comparisons using t tests with pooled SD 
## 
## data:  pain and drug 
## 
##   A          B         
## B 0.00118576 -         
## C 0.00068444 1.00000000
## 
## P value adjustment method: bonferroni
```

## Tukey's HSD

-  Another multiple comparisons procedure is Tukey's method (a.k.a. Tukey's Honest Significance Test). 

-  The function `TukeyHSD()` creates a set of confidence
intervals on the differences between means with the specified family-wise probability of coverage. 


```r
results = aov(pain ~ drug, data=migraine)
TukeyHSD(results, conf.level = 0.95)
```

```
##   Tukey multiple comparisons of means
##     95% family-wise confidence level
## 
## Fit: aov(formula = pain ~ drug, data = migraine)
## 
## $drug
##             diff           lwr         upr        p adj
## B-A 2.1111111111  0.8295027637 3.392719459 0.0011107264
## C-A 2.2222222222  0.9406138748 3.503830570 0.0006452913
## C-B 0.1111111111 -1.1704972363 1.392719459 0.9745173137
```


---
## Assumptions in ANOVA | Conditions required for a Valid ANOVA F-Test:
1. Completely Randomized Design: The samples are randomly selected in an
independent manner from the k treatment populations.
2.  All k sampled populations have distributions that are approximately normal.
3.  The k population variances are equal.

*There are ways to check (both visually and numerically) if these assumptions are satisfied*


---
## Testing homogeneity of variances

The homogeneity of variance test is called Bartlett test.


```r
bartlett.test(pain ~ drug, data=migraine)
```

```
## 
## 	Bartlett test of homogeneity of variances
## 
## data:  pain by drug
## Bartlett's K-squared = 3.8192, df = 2, p-value = 0.1481
```
-  ***The P-value is larger than 0.05. This implies no evidence for significant difference between the group variance, which means we can safely assume that the k population variances are equal.***

## SSE

Variation within the treatments = Sum of squares for Error (SSE):

## F-statistic

-  That is, 

$$
F_{k-1,n-k} = \frac{MST}{MSE} = \frac{533.8}{15.378} = 34.7
$$

- We can use this in R: 


```r
(p.value = 1-pf(34.7,5,66))

1. Completely Randomized Design: The samples are randomly selected in an

## Kruskal-Wallis Test

-  When the assumptions for a parametric ANOVA are violated, we use a nonparametric alternative. 
-  For one-way ANOVA, the alternative is known as is known as Kruskal-Wallis test. 

```r
# Kruskal Wallis Test One Way Anova by Ranks 
kruskal.test(count ~ spray, data=InsectSprays) 
```

```
## 
## 	Kruskal-Wallis rank sum test
## 
## data:  count by spray
## Kruskal-Wallis chi-squared = 54.691, df = 5, p-value = 1.511e-10
```
Reject the null hypothesis!

# Let's discuss Kruskal-Wallis in more details! 

## In class example 
We simulate data in three groups by sampling from three different Normal distributions with different means but the same variance. The observations for three groups are randomly sampled from from `\(N(15, 9^2)\)`, `\(N(25, 9^2)\)` and `\(N(30, 9^2)\)`. 


```r
## generate the simulation data
set.seed(1238991)
n=5
trt1 = rnorm(n, 15, 9)
trt2 = rnorm(n, 25, 9)
trt3 = rnorm(n, 30, 9)
y = c(trt1, trt2, trt3)
grps = rep(c("A", "B", "C"), each=n)
```

---
## Visualize (Boxplot)


```r
simdata = data.frame(y, as.factor(grps))
simdata %&gt;% ggplot(aes(y = y, x = grps)) + 
             geom_boxplot() + theme_bw()
```

![](aovexamples_new_files/figure-html/unnamed-chunk-34-1.png)&lt;!-- --&gt;


---
## ANOVA


```r
#ANOVA based on the assumption of normal distribution with equal variance
summary(aov(y ~ factor(grps), data = simdata))
```

```
##              Df Sum Sq Mean Sq F value Pr(&gt;F)  
## factor(grps)  2  401.7  200.84   3.181 0.0779 .
## Residuals    12  757.6   63.13                 
## ---
## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1
```


---
## Kruskal-Wallis Test 


```r
options(digits=10)
# Kruskal-Wallis test with chi-square approximation
kruskal.test(y,grps)
```

```
## 
## 	Kruskal-Wallis rank sum test
## 
## data:  y and grps
## Kruskal-Wallis chi-squared = 6.62, df = 2, p-value = 0.03651617
```

Now compare the test statistics and the P-values that you have calculated. 

---
## Another way 

Kruskal-Wallis test statistic value can also be calculated by the output of ANOVA test on the ranks! 


```r
## Calculate the ranks of x
rank.y = rank(y)
N = length(y)
summary(aov(rank.y ~ factor(grps)))
```

```
##              Df Sum Sq Mean Sq F value   Pr(&gt;F)  
## factor(grps)  2  132.4    66.2 5.38211 0.021457 *
## Residuals    12  147.6    12.3                   
## ---
## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1
```
Although ANOVA does a different test, we can recover the value of the Kruskal-Wallis test statistics from the output. 

---
## Kruskal-Wallis from ANOVA

Here is the test statistics (SST)


```r
SST = summary(aov(rank.y ~ factor(grps)))[[1]][1,2]
H = SST*12/(N*(N+1))
cat("Kruskal Wallis Test Statistics = ", H, "\n")
```

```
## Kruskal Wallis Test Statistics =  6.62
```

```r
cat("P value = ", 1 -pchisq(H,2))
```

```
## P value =  0.03651617375
```
